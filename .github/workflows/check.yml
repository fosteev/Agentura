name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Версия VS Code для интеграционного теста закреплена: тот же билд, что проверялся локально,
  # и ключ кэша `.vscode-test` не плавает вместе с `stable`.
  VSCODE_TEST_VERSION: '1.140.0'

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # типы, линтер, юнит-тесты, сборка
      - run: npm run check
      # сборка .vsix и проверка состава (без живого хода: он тратит токены)
      - name: package + vsix-verify
        if: matrix.os == 'ubuntu-24.04'
        run: |
          npm run package
          node scripts/vsix-verify.mjs

  integration:
    name: integration (ubuntu, xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Кэш VS Code для теста
        uses: actions/cache@v5
        with:
          # только скачанный VS Code: `user-data`/`extensions` профиля теста не замораживаем в кэше
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ env.VSCODE_TEST_VERSION }}
      - name: Системные библиотеки для Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libnss3 libxss1 libasound2t64 libgtk-3-0t64
      # VS Code под xvfb иногда не поднимается с первого раза (гонка дисплея): одна повторная попытка
      - name: test:integration
        run: |
          xvfb-run -a npm run test:integration || {
            echo '::warning::integration: первая попытка упала, повтор'
            xvfb-run -a npm run test:integration
          }
