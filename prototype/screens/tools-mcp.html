<!doctype html>
<html lang="ru" data-theme="dark" data-width="vscode">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentura · скиллы и MCP</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/preview.css">
<link rel="stylesheet" href="../shared/hud.css">
<link rel="stylesheet" href="../shared/tasks.css">
<link rel="stylesheet" href="../shared/tooltip.css">
<style>
/* Вкладки «чат | задача» в полосе задачи (как в task-tab) */
.strip.vt { padding-left: 4px; gap: 8px; }
.strip .vtab { display: flex; gap: 6px; align-items: center; align-self: stretch; padding: 0 10px; color: var(--fg-mute); border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--font); font-size: 12.5px; }
.strip .vtab.on { color: var(--fg); border-bottom-color: var(--fg); }

/* Правая панель: короткий список изменений (как в task-tab) */
/* Правая панель без «задачи»: короткий список изменений */
.rp .chg { padding: 8px 14px; display: grid; gap: 2px; font-size: 12.5px; align-content: start; }
.rp .chg .f { display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 3px 0; }
.rp .chg .f .s { font: 700 10px var(--mono); color: var(--warn); } .rp .chg .f .s.a { color: var(--ok); }
.rp .chg .f span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp .chg .f span i { font-style: normal; color: var(--fg-mute); }
.rp .chg .f em { font: 11px var(--mono); font-style: normal; white-space: nowrap; }
.rp .chg .add { color: var(--ok); } .rp .chg .del { color: var(--err, #e5534b); }
.rp .chg h5 { margin-top: 4px; }

/* ── A: сервер в колонке операции ── */
.va .pane .log .e { grid-template-columns: 14px 64px 1fr auto; }
.pane .log .e .op.mcp { color: var(--info); }
.pane .log .e .op.skill { color: var(--accent); font-weight: 600; }
.pane .log .e .op.bad { color: var(--del); }
.pane .log .e .what .arg { color: var(--fg-mute); }
.pane .log .e .r .fail { color: var(--del); }
.pane .log .e.skl .what { color: var(--fg); font-weight: 500; }

/* ── B: чип сервера и строка-разделитель скилла ── */
.pane .log .e .chip2 { display: inline-block; font: 10.5px/15px var(--mono); padding: 0 5px; margin-right: 6px; border-radius: 3px; border: 1px solid color-mix(in srgb, var(--info) 55%, transparent); color: var(--info); }
.pane .log .e .chip2.bad { border-color: color-mix(in srgb, var(--del) 55%, transparent); color: var(--del); }
.pane .log .skrow { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: baseline; margin: 4px 0; padding: 4px 8px 4px 0; border-radius: 3px; background: color-mix(in srgb, var(--accent) 9%, transparent); box-shadow: -8px 0 0 color-mix(in srgb, var(--accent) 9%, transparent), -10px 0 0 var(--accent); font-size: 12px; }
.pane .log .skrow .p { color: var(--accent); }
.pane .log .skrow b { color: var(--fg); font-weight: 600; }
.pane .log .skrow .ds { color: var(--fg-mute); }
.pane .log .skrow .r { color: var(--fg-mute); font-size: 11px; white-space: nowrap; }
.pane .log .sum .mx { color: var(--info); } .pane .log .sum .sx { color: var(--accent); }

/* ── индикатор mcp у поля ввода и всплывашка ── */
.opts .mcpb { position: relative; }
.opts .mcpb .d { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); margin-left: 5px; vertical-align: 1px; }
.opts .mcpb.open { color: var(--fg); }
.pop { position: absolute; left: 190px; bottom: 32px; width: 420px; background: var(--bg-raise); border: 1px solid var(--line-strong); border-radius: 5px; box-shadow: 0 8px 24px rgba(0,0,0,.32); font-family: var(--font); font-size: 12.5px; padding: 6px 0; z-index: 5; }
.pop h5 { margin: 6px 12px 4px; font-size: 10.5px; font-weight: 600; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .04em; display: flex; }
.pop h5 em { margin-left: auto; font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 400; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

/* строка сервера/скилла — общая для всплывашки и панели */
.srv { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 3px 12px; }
.srv .st { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.srv .st.fail { background: var(--del); } .srv .st.auth { background: var(--warn); } .srv .st.off { background: none; border: 1px solid var(--fg-faint); }
.srv .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srv .nm small { color: var(--fg-mute); margin-left: 6px; font-size: 11.5px; }
.srv .nm small.err { color: var(--del); font-family: var(--mono); font-size: 11px; }
.srv .n { font: 11px var(--mono); color: var(--fg-mute); white-space: nowrap; }
.srv .n b { color: var(--fg); font-weight: 500; }
.srv .act { font-size: 11.5px; color: var(--link); white-space: nowrap; }
.srv.dim { color: var(--fg-mute); }
.srv.sk .st { background: var(--accent); border-radius: 2px; }
.more { padding: 3px 12px 2px 30px; color: var(--link); font-size: 12px; }

/* ── правая панель: вкладка «mcp» ── */
.rp .mcpp { padding: 6px 0; display: grid; align-content: start; overflow: hidden; font-size: 12.5px; }
.rp .mcpp h5 { margin: 8px 14px 4px; font-size: 10.5px; font-weight: 600; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .04em; display: flex; }
.rp .mcpp h5 em { margin-left: auto; font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--mono); }
.rp .mcpp .srv { padding: 3px 14px; }
.rp .mcpp .exp { margin: 2px 14px 6px 32px; padding: 4px 8px; border-left: 2px solid var(--line-strong); color: var(--fg-mute); font: 11px/1.6 var(--mono); }
.rp .mcpp .exp b { color: var(--fg); font-weight: 400; }
.rp .ptabs button[role="tab"] { white-space: nowrap; padding-left: 7px; padding-right: 7px; }
.ptabs .b.warn { background: var(--warn); color: #000; }

/* ── системная строка в ленте ── */
.pane .log .sysl { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; padding: 3px 0 6px; font-size: 11.5px; color: var(--fg-mute); align-items: baseline; }
.pane .log .sysl .p { color: var(--warn); }
.pane .log .sysl b { color: var(--fg); font-weight: 500; }
.pane .log .sysl .bad { color: var(--del); }
.pane .log .sysl .wn { color: var(--warn); }
.pane .log .sysl a { color: var(--link); text-decoration: none; }
.pane .log .sysl .at { color: var(--fg-faint); font-size: 11px; }
.pane .log .sysl.ok .p { color: var(--ok); }
.pane .log .sysd { margin: -2px 0 6px 22px; padding: 4px 10px; border-left: 2px solid var(--line-strong); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 18px; font-size: 11.5px; }
.pane .log .sysd .srv { padding: 1px 0; }
</style>
</head>
<body>
<div class="preview-bar">
  <b>Скиллы и MCP</b>
  <span class="grp"><button data-set-theme="dark">Тёмная</button><button data-set-theme="light">Светлая</button></span>
  <span class="grp"><a href="#feed-a">feed-a</a> <a href="#feed-b">feed-b</a> <a href="#popover">popover</a> <a href="#panel">panel</a> <a href="#sys">sys</a></span>
  <a href="../index.html">← оглавление</a>
</div>
<div class="preview-stage">
<div class="webview" id="win"></div>
</div>
<script src="../shared/preview.js"></script>
<script>
(function () {
  var V = ['feed-a', 'feed-b', 'popover', 'panel', 'sys'];
  var v = (location.hash.slice(1) || 'feed-a').toLowerCase();
  if (V.indexOf(v) < 0) v = 'feed-a';
  var feedB = v === 'feed-b';

  var T = [
    { k: 'NEWMFC-1482', t: 'Электронная очередь: талон не печатается после перерыва', st: 'В работе', c: 'wip', open: true, chats: [
      { n: 1, e: 'codex', t: 'почему не печатает после перерыва', ctx: '168k', w: 'вчера' },
      { n: 2, e: 'claude', t: 'восстановление очереди печати', ctx: '74k', w: 'сейчас' } ] },
    { k: 'NEWMFC-1490', t: 'Окно записи: неверный часовой пояс', st: 'Тестирование', c: 'test', open: true, chats: [
      { n: 1, e: 'codex', t: 'часовой пояс в окне записи', ctx: '22k', w: '10:20' } ] },
    { k: 'GARM-833', t: 'Pulse: пуш о тревоге дублируется', st: 'Открыта', c: 'open', open: false, chats: [
      { n: 1, e: 'claude', t: 'дубль пуша тревоги', ctx: '96k', w: 'вчера' }, { n: 2, e: 'claude', t: 'тест дедупликации', ctx: '35k', w: 'вчера' }, { n: 3, e: 'codex', t: 'ревью фикса', ctx: '12k', w: 'пн' } ] }
  ];
  var FREE = [
    { e: 'claude', t: 'мигание счётчика талонов', ctx: '131k', w: '12:40' },
    { e: 'codex', t: 'почему падает lint в ws-client', ctx: '12k', w: '11:48' },
    { e: 'claude', t: 'переименовать TicketCounter в хук', ctx: '8k', w: '09:41' }
  ];
  var K = { claude: 'C', codex: 'X' };
  function mk(e) { return '<i class="mk ' + e + '" title="' + e + '">' + K[e] + '</i>'; }
  function pill(t) { return '<span class="pill ' + t.c + '">' + t.st + '</span>'; }

  // ───── боковая панель (как в task-tab) ─────
  function acc() {
    function L(a, p, r) { return '<div class="L lim-hot"><span>' + a + '</span><span class="bar"><i style="width:' + p + '%"></i></span><span class="n">' + p + ' %</span><em class="rs">' + r + '</em></div>'; }
    return '<section class="sec acc"><h3><span class="tri"></span>Аккаунт и лимиты<button class="refresh">↻</button></h3><div class="who"><b>andrey@example.com</b><span>· Max 5×</span><i class="okd"></i></div><div class="lims">' + L('Окно 5 часов', 62, '→ 17:00') + L('Неделя', 34, '→ чт 09:00') + '</div></section>';
  }
  function chatRow(c, cur) {
    return '<button class="c' + (cur === c ? ' cur' : '') + '"><span class="dot"></span>' + mk(c.e) + '<span class="t">' + (c.n ? '<em>Чат ' + c.n + ' ·</em> ' : '') + c.t + '</span><span class="cx">' + c.ctx + '</span><span class="when">' + c.w + '</span></button>';
  }
  function group(t, cur) {
    return '<div class="tgp' + (t.chats.indexOf(cur) >= 0 ? ' sel' : '') + '"><button class="tg-h" title="' + t.t + '"><i class="tw' + (t.open ? ' open' : '') + '"></i><span class="kp"><span class="key">' + t.k + '</span>' + pill(t) + '</span><span class="cn">' + t.chats.length + '</span><span class="plus">＋</span><span class="tt">' + t.t + '</span></button>' +
      (t.open ? t.chats.map(function (c) { return chatRow(c, cur); }).join('') : '') + '</div>';
  }
  function sidebar(cur) {
    return '<div class="sidebar" data-top="compact" data-list="compact"><div class="head"><span>Agentura</span><button class="gear">⚙</button></div>' + acc() +
      '<section class="sec"><h3><span class="tri"></span>Сессии<span class="r" style="color:var(--fg-mute)">queue-board</span><button class="add" style="display:inline">＋</button><button class="view">≡</button></h3></section>' +
      '<div class="tools"><input type="search" placeholder="Поиск по названию, ключу задачи" disabled><button>⚲</button></div><div class="list">' +
      T.map(function (t) { return group(t, cur); }).join('') +
      '<div class="tgp none"><button class="tg-h nokey"><i class="tw open"></i><span class="kp"><b>Без задачи</b></span><span class="cn">3</span><span class="plus">＋</span></button>' + FREE.map(function (c) { return chatRow(c, cur); }).join('') + '</div></div></div>';
  }
  function strip() {
    var t = T[0];
    return '<div class="strip vt"><span class="vtab on">чат</span><span class="vtab">задача</span><span class="sep"></span>' +
      '<span class="key">' + t.k + '</span>' + pill(t) + '<span class="ttl" title="' + t.t + '">' + t.t + '</span><a href="#">в Jiraffe ↗</a></div>';
  }
  function tab(label, o) { o = o || {}; return '<div class="etab' + (o.on ? ' on' : '') + '">' + (o.ic || '') + '<span class="n">' + label + '</span><span class="x">×</span></div>'; }
  function tabs(a) { return '<div class="etabs">' + a.join('') + '</div>'; }

  // ───── данные сессии: серверы и скиллы ─────
  var SRV = [
    { n: 'serena', st: '', tools: 21, calls: 2, ver: '0.1.4' },
    { n: 'context7', st: '', tools: 2, calls: 1, ver: '2.1.0' },
    { n: 'jira', st: '', tools: 8, calls: 1, note: 'встроенный' },
    { n: 'figma', st: '', tools: 46, calls: 0, ver: '1.9.2' },
    { n: 'marketplace', st: '', tools: 38, calls: 0 },
    { n: 'webstorm', st: 'fail', err: 'ECONNREFUSED', act: 'повторить' },
    { n: 'google-calendar', st: 'auth', note: 'нужен вход', act: 'войти' },
    { n: 'sentry', st: 'auth', note: 'нужен вход', act: 'войти' }
  ];
  var SKL = [
    { n: 'sccloud-jira-frontend-triage', how: 'сам агент', at: '14:42', tok: '3.1k' },
    { n: 'plan', how: '/plan', at: '14:20', tok: '4.6k' }
  ];
  function srvRow(s, opt) {
    opt = opt || {};
    var cls = s.st === 'fail' ? 'fail' : s.st === 'auth' ? 'auth' : '';
    var sub = s.st === 'fail' ? '<small class="err">' + s.err + '</small>' : s.note ? '<small>' + s.note + '</small>' : (opt.ver && s.ver ? '<small>v' + s.ver + '</small>' : '');
    var right = s.act ? '<span class="act">' + s.act + '</span>' :
      '<span class="n">' + s.tools + ' тул. · ' + (s.calls ? '<b>' + s.calls + '</b> выз.' : '—') + '</span>';
    return '<div class="srv' + (s.st === 'auth' ? ' dim' : '') + '"><span class="st ' + cls + '"></span><span class="nm">' + s.n + sub + '</span>' + right + '</div>';
  }
  function sklRow(s) {
    return '<div class="srv sk"><span class="st"></span><span class="nm">' + s.n + '<small>' + s.how + ' · ' + s.at + '</small></span><span class="n">' + s.tok + '</span></div>';
  }

  // ───── лента ─────
  function e(op, what, r, cls, opCls) {
    return '<div class="e' + (cls ? ' ' + cls : '') + '"><span class="p">▸</span><span class="op' + (opCls ? ' ' + opCls : '') + '">' + op + '</span><span class="what">' + what + '</span><span class="r">' + r + '</span></div>';
  }
  function mcp(server, tool, arg, r, bad) {
    if (feedB) return e('mcp', '<span class="chip2' + (bad ? ' bad' : '') + '">' + server + '</span>' + tool + (arg ? ' <span class="arg">' + arg + '</span>' : ''), r, '', bad ? 'bad' : 'mcp');
    return e(server, tool + (arg ? ' <span class="arg">' + arg + '</span>' : ''), r, '', bad ? 'bad' : 'mcp');
  }
  function skill(s) {
    if (feedB) return '<div class="skrow"><span class="p">◆</span><span><span class="ds">скилл</span> <b>' + s.n + '</b> <span class="ds">· вызвал ' + s.how + '</span></span><span class="r">' + s.tok + ' · <a href="#" style="color:var(--link);text-decoration:none">открыть SKILL.md</a></span></div>';
    return e('skill', s.n + ' <span class="arg">· ' + s.how + '</span>', s.tok + ' · <a href="#">SKILL.md</a>', 'skl', 'skill');
  }
  function sysHead() {
    if (v !== 'sys') return '';
    var d = '<div class="sysd">' + SRV.map(function (s) { return srvRow(s); }).join('') + '</div>';
    return '<div class="sysl"><span class="p">▲</span><span>MCP: <b>5 подключены</b> · <span class="bad">webstorm не подключился</span> (ECONNREFUSED) · <span class="wn">2 ждут входа</span> · скиллов доступно <b>54</b> · <a href="#">свернуть</a></span><span class="at">14:19</span></div>' + d;
  }
  function log() {
    var S = SKL[0];
    return '<div class="log">' + sysHead() +
      '<div class="ref"><span class="p">✓</span><span>контекст задачи <b>NEWMFC-1482</b> · описание, 4 комментария, 2 вложения · <a href="#">обновить</a></span><span class="at">14:41</span></div>' +
      '<div class="u"><span class="p">&gt;</span><span>Талон не печатается после перерыва оператора: принтер в статусе ready, а очередь печати стоит. Разберись по задаче и почини.</span><span class="at">14:42</span></div>' +
      skill(S) +
      (feedB ? mcp('jira', 'get_issue', 'NEWMFC-1482', '4 комм. · 0.6s') : mcp('jira', 'get_issue', 'NEWMFC-1482', '4 комм. · 0.6s')) +
      '<div class="e think"><span class="p">▸</span><span class="op">think</span><span class="what">после паузы сбрасывается соединение с принтером, а флаг busy остаётся</span><span class="r">8s</span></div>' +
      mcp('serena', 'find_symbol', 'PrintQueue/resume', '1 · 0.8s') +
      mcp('serena', 'find_referencing_symbols', 'resume', '4 · 1.1s') +
      mcp('context7', 'query-docs', 'escpos: reconnect after idle', '2.3s') +
      mcp('webstorm', 'get_file_problems', 'PrintQueue.ts', '<span class="fail">✕ сервер не подключён</span>', true) +
      e('edit', '<span class="dim">packages/printer/src/</span>PrintQueue.ts', '<span class="add">+9</span> <span class="del">−2</span> · <a href="#">diff</a>') +
      e('bash', 'pnpm test --filter printer', '<span class="pass">21 ✓</span> · 6.4s', 'run') +
      '<div class="txt"><p>Причина в <code>PrintQueue.resume()</code>: после паузы флаг <code>busy</code> не сбрасывался, и очередь считала принтер занятым. Теперь он сбрасывается в <code>onPause</code>; добавил тест на печать после перерыва.</p></div>' +
      '<div class="sum"><span>in 410</span><span>out 892</span><span>cache r74 100</span>' + (feedB ? '<span class="mx">mcp 5</span><span class="sx">скилл 1</span>' : '') + '<b>$0.06</b><span>19s</span></div></div>';
  }
  function compose() {
    var b = '', i; for (i = 0; i < 20; i++) b += '<i' + (i < 7 ? ' class="on"' : '') + '></i>';
    var showMcp = v === 'popover' || v === 'panel' || v === 'sys';
    return '<footer class="compose"><div class="blocks">' + b + '</div><div class="ctx"><span><span class="chip">NEWMFC-1482</span></span><span class="cn">контекст <b class="ok">74 100</b> / 200 000 · <button>сжать</button></span></div>' +
      '<div class="prompt"><span class="p">$</span><span class="text">задача, @файл, /команда</span></div><div class="opts"><button class="mode">режим <b>manual</b></button><button class="agent">агент <b>claude</b></button><button>модель <b>opus-5.5</b></button><button>effort <b>high</b></button>' +
      (showMcp ? '<button class="mcpb' + (v === 'popover' ? ' open' : '') + '" title="MCP-серверы: 5 из 8 подключены">mcp <b>5/8</b><span class="d"></span></button>' : '') +
      '<button class="send">enter ↵</button></div></footer>';
  }
  function popover() {
    if (v !== 'popover') return '';
    return '<div class="pop"><h5>MCP-серверы<em>5 из 8 · ↻</em></h5>' + SRV.map(function (s) { return srvRow(s, { ver: true }); }).join('') +
      '<hr><h5>Скиллы в этой сессии<em>доступно 54</em></h5>' + SKL.map(sklRow).join('') + '<div class="more">все скиллы…</div></div>';
  }
  function panel() {
    var isM = v === 'panel';
    var tabsH = '<div class="ptabs" role="tablist"><button role="tab" aria-selected="' + !isM + '">изменения <span class="b">2</span></button><button role="tab" aria-selected="false">git</button><button role="tab" aria-selected="false">агенты</button>' +
      (isM ? '<button role="tab" aria-selected="true">mcp <span class="b warn">1</span></button>' : '') +
      '<button class="phide" title="Скрыть панель"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M10 2.5v11" stroke-dasharray="1.6 1.4"/></svg></button></div>';
    if (isM) {
      var rows = SRV.map(function (s) {
        var r = srvRow(s);
        if (s.n === 'serena') r += '<div class="exp"><b>find_symbol</b> ×1 · <b>find_referencing_symbols</b> ×1</div>';
        return r;
      }).join('');
      return '<aside class="rp">' + tabsH + '<div class="mcpp"><h5>MCP-серверы<em>5/8 · ↻</em></h5>' + rows +
        '<h5 style="margin-top:12px">Скиллы в сессии<em>2 из 54</em></h5>' + SKL.map(sklRow).join('') + '<div class="more">все доступные скиллы…</div></div></aside>';
    }
