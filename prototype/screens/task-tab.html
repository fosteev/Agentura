<!doctype html>
<html lang="ru" data-theme="dark" data-width="vscode">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentura · вкладка «задача»</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/preview.css">
<link rel="stylesheet" href="../shared/hud.css">
<link rel="stylesheet" href="../shared/tasks.css">
<link rel="stylesheet" href="../shared/tooltip.css">
<style>
/* Вкладки «чат | задача» в полосе задачи над лентой */
.strip.vt { padding-left: 4px; gap: 8px; }
.strip .vtab { display: flex; gap: 6px; align-items: center; align-self: stretch; padding: 0 10px; color: var(--fg-mute); border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--font); font-size: 12.5px; }
.strip .vtab.on { color: var(--fg); border-bottom-color: var(--fg); }
.strip .vtab .nb { font: 10px/14px var(--mono); padding: 0 5px; border-radius: 7px; background: var(--info); color: #fff; font-style: normal; }
.strip .vtab .spin { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--info); border-right-color: transparent; }
.strip .vtab .wt { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.strip .run { color: var(--info); font: 11px var(--mono); white-space: nowrap; }

/* Правая панель без «задачи»: короткий список изменений */
.rp .chg { padding: 8px 14px; display: grid; gap: 2px; font-size: 12.5px; align-content: start; }
.rp .chg .f { display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 3px 0; }
.rp .chg .f .s { font: 700 10px var(--mono); color: var(--warn); } .rp .chg .f .s.a { color: var(--ok); }
.rp .chg .f span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp .chg .f span i { font-style: normal; color: var(--fg-mute); }
.rp .chg .f em { font: 11px var(--mono); font-style: normal; white-space: nowrap; }
.rp .chg .add { color: var(--ok); } .rp .chg .del { color: var(--err, #e5534b); }
.rp .chg h5 { margin-top: 4px; }

/* Карточка задачи — вёрстка Jiraffe внутри вкладки */
.tc { flex: 1; min-height: 0; display: flex; overflow: hidden; font-family: var(--font); font-size: 13px; }
.tc .tm { flex: 1; min-width: 0; padding: 14px 20px 0; overflow: hidden; position: relative; }
.tc .crumb { display: flex; gap: 8px; align-items: center; color: var(--fg-mute); font-size: 12px; }
.tc .crumb .tic { background: #4ba35b; }
.tc .crumb .sp { flex: 1; }
.tc .crumb .upd { font: 11px var(--mono); }
.tc .crumb .rf { color: var(--fg-mute); font-size: 13px; }
.tc h1 { margin: 6px 0 10px; font-size: 19px; font-weight: 600; line-height: 1.25; }
.tc .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.tc .btn { display: inline-flex; gap: 6px; align-items: center; height: 26px; padding: 0 10px; border-radius: 3px; background: var(--btn-2); color: var(--btn-2-fg); font-size: 12px; white-space: nowrap; }
.tc .btn.st { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
.tc .btn.st.test { background: color-mix(in srgb, var(--agent) 18%, transparent); color: var(--agent); }
.tc .btn.pri { background: var(--btn); color: var(--btn-fg); }
.tc a { color: var(--link); text-decoration: none; }
.tc .bar .ext { margin-left: auto; color: var(--link); font-size: 12px; white-space: nowrap; }
.tc .meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 16px; padding: 8px 0 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tc .meta span { display: block; color: var(--fg-mute); font-size: 11px; } .tc .meta b { font-weight: 400; }
.tc h4 { margin: 0 0 5px; font-size: 12px; color: var(--fg-mute); font-weight: 600; display: flex; gap: 6px; }
.tc h4 em { font-style: normal; font-weight: 400; font-family: var(--mono); font-size: 11px; color: var(--fg-faint); }
.tc .rich { line-height: 1.5; max-width: 78ch; margin-bottom: 12px; }
.tc .rich p { margin: 0 0 6px; }
.tc .rich ol { margin: 0 0 6px; padding-left: 20px; } .tc .rich li { margin: 1px 0; }
.tc .rich code { font-family: var(--mono); font-size: 12px; background: var(--bg-code); padding: 0 4px; border-radius: 3px; }
.tc .rich .q { border-left: 3px solid var(--line-strong); padding: 2px 10px; color: var(--fg-mute); margin: 0 0 6px; }
.tc .atts { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.tc .att { width: 132px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--bg-side); font-size: 11.5px; }
.tc .att .th { height: 62px; display: grid; place-items: center; color: var(--fg-faint); font: 11px var(--mono); background: repeating-linear-gradient(135deg, var(--bg-code) 0 8px, transparent 8px 16px); }
.tc .att .th.img { background: linear-gradient(160deg, #3b4c63, #24303f); color: #9fb3cc; }
.tc .att .nm { padding: 4px 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tc .att .sz { padding: 0 6px 5px; color: var(--fg-mute); font: 10.5px var(--mono); }
.tc .subtabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.tc .subtabs span { padding: 5px 12px; color: var(--fg-mute); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tc .subtabs span.on { color: var(--fg); border-bottom-color: var(--accent); }
.tc .subtabs .cnt { margin-left: 5px; font: 10.5px var(--mono); color: var(--fg-faint); }
.tc .subtabs .cnt.nw { color: #fff; background: var(--info); border-radius: 7px; padding: 0 5px; }
.tc .cmt { display: flex; gap: 10px; margin-bottom: 10px; position: relative; }
.tc .av { width: 28px; height: 28px; border-radius: 50%; background: #5b7fa6; color: #fff; display: grid; place-items: center; font-size: 11px; flex: none; }
.tc .av.mkv { border-radius: 5px; background: none; } .tc .av.mkv .mk { width: 28px; height: 28px; font-size: 13px; border-radius: 5px; }
.tc .cmt .w { font-size: 12px; color: var(--fg-mute); display: flex; gap: 6px; align-items: baseline; } .tc .cmt .w b { color: var(--fg); font-weight: 500; }
.tc .cmt p { margin: 2px 0 0; line-height: 1.45; }
.tc .cmt.hv { background: var(--bg-hover); margin-left: -8px; margin-right: -8px; padding: 4px 8px; border-radius: 4px; }
.tc .cmt .tochat { position: absolute; right: 8px; top: 4px; font-size: 11.5px; color: var(--link); background: var(--bg-raise); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 6px; line-height: 18px; }
.tc .cmt.new { background: color-mix(in srgb, var(--accent) 10%, transparent); margin-left: -8px; margin-right: -8px; padding: 4px 8px; border-radius: 4px; box-shadow: inset 3px 0 0 var(--accent); }
.tc .cmt .fr { font: 10.5px/15px var(--mono); color: var(--fg-mute); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 5px; }
.tc .reply { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 14px; }
.tc .reply .box { flex: 1; min-height: 30px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg-input); padding: 6px 10px; color: var(--fg-faint); }
/* поля справа на широкой вкладке */
.tc .ts { width: 280px; flex: none; border-left: 1px solid var(--line); background: var(--bg-side); padding: 14px 16px; display: grid; gap: 14px; align-content: start; overflow: hidden; font-size: 12.5px; }
.tc .ts h5 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .03em; display: flex; }
.tc .ts h5 em { font-style: normal; font-weight: 400; margin-left: auto; text-transform: none; letter-spacing: 0; }
.tc .ts .kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 8px; align-items: center; }
.tc .ts .kv span { color: var(--fg-mute); }
.tc .ts .kv b { font-weight: 400; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc .ts .kv .who2 { display: flex; gap: 6px; align-items: center; } .tc .ts .kv .who2 i { width: 18px; height: 18px; border-radius: 50%; background: #5b7fa6; color: #fff; font: 600 8.5px/18px var(--font); text-align: center; font-style: normal; flex: none; }
.tc .ts .r { display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 3px 0; color: var(--fg-mute); }
.tc .ts .r.cur { color: var(--fg); }
.tc .ts .r em { font-style: normal; font: 11px var(--mono); }
.tc .ts .r .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--info); margin-right: 5px; }
.tc .ts .nw2 { display: flex; gap: 8px; color: var(--fg-mute); padding-top: 3px; }
.tc .ts .tm2 { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; }
.tc .ts .tm2 .bar2 { grid-column: 1 / 3; height: 5px; border-radius: 3px; background: var(--bg-input); overflow: hidden; } .tc .ts .tm2 .bar2 i { display: block; height: 100%; width: 42%; background: var(--info); }
.tc .ts .tm2 span { color: var(--fg-mute); font-size: 11.5px; } .tc .ts .tm2 b { font: 400 11.5px var(--mono); }
/* тост «агент ждёт ответа» */
.toast2 { position: absolute; right: 16px; bottom: 14px; display: flex; gap: 10px; align-items: center; padding: 8px 10px 8px 12px; background: var(--bg-raise); border: 1px solid var(--line-strong); border-left: 3px solid var(--warn); border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.28); font-size: 12.5px; z-index: 4; }
.toast2 .mk { width: 16px; height: 16px; }
.toast2 button { height: 22px; padding: 0 10px; border-radius: 3px; background: var(--btn); color: var(--btn-fg); font-size: 12px; }
</style>
</head>
<body>
<div class="preview-bar">
  <b>Вкладка «задача» рядом с чатом</b>
  <span class="grp"><button data-set-theme="dark">Тёмная</button><button data-set-theme="light">Светлая</button></span>
  <span class="grp"><a href="#chat">chat</a> <a href="#task">task</a> <a href="#wide">wide</a> <a href="#busy">busy</a> <a href="#wait">wait</a></span>
  <a href="../index.html">← оглавление</a>
</div>
<div class="preview-stage">
<div class="webview" id="win"></div>
</div>
<script src="../shared/preview.js"></script>
<script>
(function () {
  var v = (location.hash.slice(1) || 'chat').toLowerCase();
  if (['chat', 'task', 'wide', 'busy', 'wait'].indexOf(v) < 0) v = 'chat';
  var onTask = v !== 'chat';
  var running = v === 'busy';

  var T = [
    { k: 'NEWMFC-1482', t: 'Электронная очередь: талон не печатается после перерыва', st: 'В работе', c: 'wip', open: true, chats: [
      { n: 1, e: 'claude', t: 'почему не печатает после перерыва', ctx: '168k', w: 'вчера' },
      { n: 2, e: 'codex', t: 'восстановление очереди печати', ctx: '74k', w: 'сейчас', live: running, wait: v === 'wait' } ] },
    { k: 'NEWMFC-1490', t: 'Окно записи: неверный часовой пояс', st: 'Тестирование', c: 'test', open: true, chats: [
      { n: 1, e: 'codex', t: 'часовой пояс в окне записи', ctx: '22k', w: '10:20' } ] },
    { k: 'GARM-833', t: 'Pulse: пуш о тревоге дублируется', st: 'Открыта', c: 'open', open: false, chats: [
      { n: 1, e: 'claude', t: 'дубль пуша тревоги', ctx: '96k', w: 'вчера' }, { n: 2, e: 'claude', t: 'тест дедупликации', ctx: '35k', w: 'вчера' }, { n: 3, e: 'codex', t: 'ревью фикса', ctx: '12k', w: 'пн' } ] }
  ];
  var FREE = [
    { e: 'claude', t: 'мигание счётчика талонов', ctx: '131k', w: '12:40' },
    { e: 'codex', t: 'почему падает lint в ws-client', ctx: '12k', w: '11:48' },
    { e: 'claude', t: 'переименовать TicketCounter в хук', ctx: '8k', w: '09:41' }
  ];
  var K = { claude: 'C', codex: 'X' };
  function mk(e) { return '<i class="mk ' + e + '" title="' + e + '">' + K[e] + '</i>'; }
  function pill(t) { return '<span class="pill ' + t.c + '">' + t.st + '</span>'; }

  // ───── боковая панель (как в task-mode) ─────
  function acc() {
    function L(a, p, r) { return '<div class="L lim-hot"><span>' + a + '</span><span class="bar"><i style="width:' + p + '%"></i></span><span class="n">' + p + ' %</span><em class="rs">' + r + '</em></div>'; }
    return '<section class="sec acc"><h3><span class="tri"></span>Аккаунт и лимиты<button class="refresh">↻</button></h3><div class="who"><b>andrey@example.com</b><span>· Max 5×</span><i class="okd"></i></div><div class="lims">' + L('Окно 5 часов', 62, '→ 17:00') + L('Неделя', 34, '→ чт 09:00') + '</div></section>';
  }
  function chatRow(c, cur) {
    return '<button class="c' + (cur === c ? ' cur' : '') + (c.live ? ' live' : '') + (c.wait ? ' wait' : '') + '"><span class="dot"></span>' + mk(c.e) + '<span class="t">' + (c.n ? '<em>Чат ' + c.n + ' ·</em> ' : '') + c.t + '</span><span class="cx">' + c.ctx + '</span><span class="when">' + c.w + '</span></button>';
  }
  function group(t, cur) {
    return '<div class="tgp' + (t.chats.indexOf(cur) >= 0 ? ' sel' : '') + '"><button class="tg-h" title="' + t.t + '"><i class="tw' + (t.open ? ' open' : '') + '"></i><span class="kp"><span class="key">' + t.k + '</span>' + pill(t) + '</span><span class="cn">' + t.chats.length + '</span><span class="plus">＋</span><span class="tt">' + t.t + '</span></button>' +
      (t.open ? t.chats.map(function (c) { return chatRow(c, cur); }).join('') : '') + '</div>';
  }
  function sidebar(cur) {
    return '<div class="sidebar" data-top="compact" data-list="compact"><div class="head"><span>Agentura</span><button class="gear">⚙</button></div>' + acc() +
      '<section class="sec"><h3><span class="tri"></span>Сессии<span class="r" style="color:var(--fg-mute)">queue-board</span><button class="add" style="display:inline">＋</button><button class="view">≡</button></h3></section>' +
      '<div class="tools"><input type="search" placeholder="Поиск по названию, ключу задачи" disabled><button>⚲</button></div><div class="list">' +
      T.map(function (t) { return group(t, cur); }).join('') +
      '<div class="tgp none"><button class="tg-h nokey"><i class="tw open"></i><span class="kp"><b>Без задачи</b></span><span class="cn">3</span><span class="plus">＋</span></button>' + FREE.map(function (c) { return chatRow(c, cur); }).join('') + '</div></div></div>';
  }

  // ───── полоса: вкладки «чат | задача» + ключ задачи ─────
  function strip() {
    var t = T[0], chatMark = '';
    if (onTask && running) chatMark = '<span class="spin" title="Идёт ход"></span><i class="nb">3</i>';
    if (onTask && v === 'wait') chatMark = '<span class="wt" title="Агент ждёт ответа"></span>';
    return '<div class="strip vt"><span class="vtab' + (onTask ? '' : ' on') + '">чат' + chatMark + '</span>' +
      '<span class="vtab' + (onTask ? ' on' : '') + '">задача' + (!onTask ? '<i class="nb">1</i>' : '') + '</span><span class="sep"></span>' +
      '<span class="key">' + t.k + '</span>' + pill(t) + '<span class="ttl" title="' + t.t + '">' + t.t + '</span>' +
      (onTask && running ? '<span class="run">ход 1:12</span>' : '') + '<a href="#">в Jiraffe ↗</a></div>';
  }
  function tab(label, o) { o = o || {}; return '<div class="etab' + (o.on ? ' on' : '') + '">' + (o.ic || '') + '<span class="n">' + label + '</span><span class="x">×</span></div>'; }
  function tabs(a) { return '<div class="etabs">' + a.join('') + '</div>'; }

  // ───── чат ─────
  function log() {
    return '<div class="log">' +
      '<div class="ref"><span class="p">✓</span><span>контекст задачи <b>NEWMFC-1482</b> · описание, 4 комментария, 2 вложения · <a href="#">обновить</a></span><span class="at">14:41</span></div>' +
      '<div class="u"><span class="p">&gt;</span><span>Талон не печатается после перерыва оператора: принтер в статусе ready, а очередь печати стоит. Разберись и почини, по задаче.</span><span class="at">14:42</span></div>' +
      '<div class="e think"><span class="p">▸</span><span class="op">think</span><span class="what">после паузы сбрасывается соединение с принтером, а флаг busy остаётся</span><span class="r">8s</span></div>' +
      '<div class="e"><span class="p">▸</span><span class="op">read</span><span class="what"><span class="dim">packages/printer/src/</span>PrintQueue.ts</span><span class="r">0.3s</span></div>' +
      '<div class="e"><span class="p">▸</span><span class="op">edit</span><span class="what"><span class="dim">packages/printer/src/</span>PrintQueue.ts</span><span class="r"><span class="add">+9</span> <span class="del">−2</span> · <a href="#">diff</a></span></div>' +
      '<div class="e run"><span class="p">▸</span><span class="op">bash</span><span class="what">pnpm test --filter printer</span><span class="r"><span class="pass">21 ✓</span> · 6.4s</span></div>' +
      '<div class="txt"><p>Причина в <code>PrintQueue.resume()</code>: после паузы флаг <code>busy</code> не сбрасывался, и очередь считала принтер занятым. Теперь он сбрасывается при <code>onPause</code>; добавил тест на печать после перерыва.</p></div><div class="sum"><span>in 410</span><span>out 892</span><span>cache r74 100</span><b>$0.06</b><span>19s</span></div></div>';
  }
  function compose() {
    var b = '', i; for (i = 0; i < 20; i++) b += '<i' + (i < 7 ? ' class="on"' : '') + '></i>';
    return '<footer class="compose"><div class="blocks">' + b + '</div><div class="ctx"><span><span class="chip">NEWMFC-1482</span></span><span class="cn">контекст <b class="ok">74 100</b> / 200 000 · <button>сжать</button></span></div>' +
      '<div class="prompt"><span class="p">$</span><span class="text">задача, @файл, /команда</span></div><div class="opts"><button class="mode">режим <b>manual</b></button><button class="agent">агент <b>codex</b></button><button>модель <b>gpt-5-codex</b></button><button>effort <b>high</b></button><button class="send">enter ↵</button></div></footer>';
  }
  function panel() {
    function f(s, d, n, a, r) { return '<div class="f"><span class="s' + (s === 'A' ? ' a' : '') + '">' + s + '</span><span><i>' + d + '</i>' + n + '</span><em><span class="add">+' + a + '</span> <span class="del">−' + r + '</span></em></div>'; }
    return '<aside class="rp"><div class="ptabs" role="tablist"><button role="tab" aria-selected="true">изменения <span class="b">2</span></button><button role="tab" aria-selected="false">git</button><button role="tab" aria-selected="false">агенты</button>' +
      '<button class="phide" title="Скрыть панель"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M10 2.5v11" stroke-dasharray="1.6 1.4"/></svg></button></div>' +
      '<div class="chg"><h5>Ход 3 · 14:42</h5>' + f('M', 'packages/printer/src/', 'PrintQueue.ts', 9, 2) + f('A', 'packages/printer/test/', 'resume.test.ts', 34, 0) +
      '<h5 style="margin-top:10px">Ход 2 · 14:20</h5>' + f('M', 'packages/printer/src/', 'socket.ts', 3, 1) + '</div></aside>';
  }

  // ───── вкладка «задача» ─────
  var CMS = [
    { av: 'МК', bg: '#5b7fa6', n: 'М. Крылова', w: 'вчера 17:20', p: 'Приложила лог терминала за пятницу, обрыв соединения с принтером виден около 14:05.' },
    { av: 'ИП', bg: '#8a6bb0', n: 'И. Петров', w: 'сегодня 09:12', p: 'Подтверждаю на втором киоске. Печатает только после ручной перезагрузки службы.', hv: true },
    { av: 'ДС', bg: '#4f9a86', n: 'Д. Соколов', w: 'сегодня 12:05', p: 'Похоже на тот же сброс сокета, что в <a href="#">NEWMFC-1431</a>. Проверьте, нет ли там общего кода.' }
  ];
  function comments() {
    var h = CMS.map(function (c) {
      return '<div class="cmt' + (c.hv && v === 'task' ? ' hv' : '') + '"><span class="av" style="background:' + c.bg + '">' + c.av + '</span><div><div class="w"><b>' + c.n + '</b> · ' + c.w + '</div><p>' + c.p + '</p></div>' +
        (c.hv && v === 'task' ? '<span class="tochat" title="Вставить комментарий в поле ввода чата">↳ в чат</span>' : '') + '</div>';
    }).join('');
    if (running) h += '<div class="cmt new"><span class="av mkv">' + mk('codex') + '</span><div><div class="w"><b>агент</b> · от имени А. Фостеева · только что <span class="fr">из этого чата</span></div><p>Причина: после паузы не сбрасывался флаг busy в <code style="font-family:var(--mono);font-size:12px">PrintQueue.resume()</code>. Исправлено, тесты принтера проходят (21). Проверьте печать после второго перерыва.</p></div></div>';
    return h + '<div class="reply"><span class="av" style="background:#c96442">АФ</span><div class="box">Написать комментарий…</div></div>';
  }
  function taskCard(wide) {
    var t = T[0];
    var head = '<div class="crumb"><i class="tic">✓</i><span>' + t.k + '</span><span>·</span><span>Задача</span>' + (wide ? '' : '<span>·</span><span>Приоритет: высокий</span>') + '<span class="sp"></span><button class="rf" title="Обновить">↻</button><span class="upd">' + (running ? 'только что' : 'обновлено 10 с назад') + '</span></div>' +
      '<h1>' + t.t + '</h1>' +
      '<div class="bar"><button class="btn st">В работе ▾</button><button class="btn">Ворклог</button><button class="btn pri" title="Вставить задачу или выделенный текст в поле ввода чата">↳ в чат</button></div>';
    var meta = wide ? '' : '<div class="meta"><div><span>Исполнитель</span><b>А. Фостеев</b></div><div><span>Автор</span><b>М. Крылова</b></div><div><span>Компонент</span><b>smart_eq_terminal</b></div><div><span>Обновлено</span><b>сегодня, 14:12</b></div></div>';
    var desc = '<h4>Описание</h4><div class="rich"><p>На терминале в МФЦ после перерыва оператора (пауза ≥ 5 минут) талон выдаётся на экран, но печать не запускается. Принтер в статусе <code>ready</code>, в логе — ни ошибок, ни запросов на печать.</p>' +
      '<p><b>Шаги:</b></p><ol><li>Оператор уходит на перерыв, пауза ≥ 5 минут.</li><li>Посетитель берёт талон на киоске.</li><li>Талон на экране есть, на бумаге — нет.</li></ol>' +
      (wide ? '<div class="q">Воспроизводится на киосках с принтером Custom TK-180, версия терминала 4.12. Помогает только перезапуск службы.</div>' : '') + '</div>';
    var atts = '<h4>Вложения <em>2</em></h4><div class="atts"><div class="att"><div class="th">.log</div><div class="nm">terminal-2026-10-03.log</div><div class="sz">148 КБ</div></div><div class="att"><div class="th img">PNG</div><div class="nm">kiosk-printer-status.png</div><div class="sz">212 КБ</div></div></div>';
    var sub = '<div class="subtabs"><span class="on">Комментарии<i class="cnt' + (running ? ' nw' : '') + '">' + (running ? '4' : '3') + '</i></span><span>История<i class="cnt">9</i></span><span>Ворклог<i class="cnt">' + (running ? '3' : '2') + '</i></span></div>';
    var main = '<div class="tm">' + head + meta + desc + atts + sub + comments() + '</div>';
    if (!wide) return '<div class="tc">' + main + '</div>';
    var side = '<aside class="ts"><div><h5>Поля</h5><div class="kv">' +
      '<span>Статус</span><b><span class="pill wip">В работе</span></b>' +
      '<span>Исполнитель</span><b class="who2"><i style="background:#c96442">АФ</i>А. Фостеев</b>' +
      '<span>Автор</span><b class="who2"><i>МК</i>М. Крылова</b>' +
      '<span>Приоритет</span><b>высокий</b><span>Компонент</span><b>smart_eq_terminal</b><span>Версия</span><b>4.13</b><span>Метки</span><b><span class="key">printer</span> <span class="key">kiosk</span></b>' +
      '<span>Создана</span><b>3 окт, 11:40</b><span>Обновлено</span><b>сегодня, 14:12</b></div></div>' +
      '<div><h5>Время</h5><div class="tm2"><span>залогировано</span><b>' + (running ? '3 ч' : '2 ч') + ' из 6 ч</b><span class="bar2"><i style="width:' + (running ? 50 : 33) + '%"></i></span></div></div>' +
      '<div><h5>Чаты по задаче<em>2</em></h5>' +
      '<div class="r">' + mk('claude') + '<span>Чат 1 · claude</span><em>вчера</em></div>' +
      '<div class="r cur">' + mk('codex') + '<span>' + (running ? '<span class="dot"></span>' : '') + 'Чат 2 · codex <em>· этот</em></span><em>сейчас</em></div>' +
      '<div class="nw2"><span>＋</span><span>новый чат</span></div></div></aside>';
    return '<div class="tc">' + main + side + '</div>';
  }

  // ───── сборка ─────
  var cur = T[0].chats[1];
  var chatTabs = tabs([tab('NEWMFC-1482 · Чат 2', { on: true, ic: mk('codex') }), tab('NEWMFC-1482 · Чат 1', { ic: mk('claude') }), tab('lint в ws-client', { ic: mk('codex') })]);
  var ed;
  if (v === 'chat') ed = chatTabs + '<div class="edrow"><div class="egrp narrow"><div class="pane">' + strip() + log() + compose() + '</div></div>' + panel() + '</div>';
  else if (v === 'task') ed = chatTabs + '<div class="edrow"><div class="egrp narrow"><div class="pane">' + strip() + taskCard(false) + '</div></div>' + panel() + '</div>';
  else ed = chatTabs + '<div class="edrow"><div class="egrp" style="position:relative"><div class="pane">' + strip() + taskCard(true) + '</div>' +
    (v === 'wait' ? '<div class="toast2">' + mk('codex') + '<span>Агент ждёт ответа: <b>разрешить git push?</b></span><button>к чату</button></div>' : '') + '</div></div>';
  document.getElementById('win').innerHTML = sidebar(cur) + '<div class="ed">' + ed + '</div>';
  var tm = document.querySelector('.tc .tm');
  if (tm && running) tm.scrollTop = tm.scrollHeight;
  window.addEventListener('hashchange', function () { location.reload(); });
})();
</script>
<script src="../shared/tooltip.js"></script>
</body>
</html>
